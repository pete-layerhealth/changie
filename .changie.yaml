# yaml-language-server: $schema=docs/schema.json
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} on {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* [#{{.Custom.Issue}}](https://github.com/miniscruff/changie/issues/{{.Custom.Issue}}) {{.Body}}'
kinds:
  - label: ✨ Added
    key: added
    auto: minor
  - label: 🔥 Changed
    key: changed
    auto: major
  - label: ⚰️ Deprecated
    key: deprecated
    auto: minor
  - label: 🗑️ Removed
    key: removed
    auto: minor
  - label: 🪲 Fixed
    key: fixed
    auto: patch
  - label: 🦺 Security
    key: security
    auto: patch
newlines:
  afterChangelogHeader: 1
  afterKind: 1
  afterChangelogVersion: 1
  beforeKind: 1
  endOfVersion: 1
custom:
- key: Issue
  type: int
  minInt: 1
# follows https://gitmoji.dev/ conventions
- key: Emoji
  type: enum
  enumOptions:
    - "🎨 - Improve structure / format of the code."
    - "⚡️ - Improve performance."
    - "🔥 - Remove code or files."
    - "🐛 - Fix a bug."
    - "🚑️ - Critical hotfix."
    - "✨ - Introduce new features."
    - "📝 - Add or update documentation."
    - "🚀 - Deploy stuff."
    - "💄 - Add or update the UI and style files."
    - "🎉 - Begin a project."
    - "✅ - Add, update, or pass tests."
    - "🔒️ - Fix security or privacy issues."
    - "🔐 - Add or update secrets."
    - "🔖 - Release / Version tags."
    - "🚨 - Fix compiler / linter warnings."
    - "🚧 - Work in progress."
    - "💚 - Fix CI Build."
    - "⬇️ - Downgrade dependencies."
    - "⬆️ - Upgrade dependencies."
    - "📌 - Pin dependencies to specific versions."
    - "👷 - Add or update CI build system."
    - "📈 - Add or update analytics or track code."
    - "♻️ - Refactor code."
    - "➕ - Add a dependency."
    - "➖ - Remove a dependency."
    - "🔧 - Add or update configuration files."
    - "🔨 - Add or update development scripts."
    - "🌐 - Internationalization and localization."
    - "✏️ - Fix typos."
    - "💩 - Write bad code that needs to be improved."
    - "⏪️ - Revert changes."
    - "🔀 - Merge branches."
    - "📦️ - Add or update compiled files or packages."
    - "👽️ - Update code due to external API changes."
    - "🚚 - Move or rename resources (e.g.: files, paths, routes)."
    - "📄 - Add or update license."
    - "💥 - Introduce breaking changes."
    - "🍱 - Add or update assets."
    - "♿️ - Improve accessibility."
    - "💡 - Add or update comments in source code."
    - "🍻 - Write code drunkenly."
    - "💬 - Add or update text and literals."
    - "🗃️ - Perform database related changes."
    - "🔊 - Add or update logs."
    - "🔇 - Remove logs."
    - "👥 - Add or update contributor(s)."
    - "🚸 - Improve user experience / usability."
    - "🏗️ - Make architectural changes."
    - "📱 - Work on responsive design."
    - "🤡 - Mock things."
    - "🥚 - Add or update an easter egg."
    - "🙈 - Add or update a .gitignore file."
    - "📸 - Add or update snapshots."
    - "⚗️ - Perform experiments."
    - "🔍️ - Improve SEO."
    - "🏷️ - Add or update types."
    - "🌱 - Add or update seed files."
    - "🚩 - Add, update, or remove feature flags."
    - "🥅 - Catch errors."
    - "💫 - Add or update animations and transitions."
    - "🗑️ - Deprecate code that needs to be cleaned up."
    - "🛂 - Work on code related to authorization, roles and permissions."
    - "🩹 - Simple fix for a non-critical issue."
    - "🧐 - Data exploration/inspection."
    - "⚰️ - Remove dead code."
    - "🧪 - Add a failing test."
    - "👔 - Add or update business logic."
    - "🩺 - Add or update healthcheck."
    - "🧱 - Infrastructure related changes."
    - "🧑‍💻 - Improve developer experience."
    - "💸 - Add sponsorships or money related infrastructure."
    - "🧵 - Add or update code related to multithreading or concurrency."
    - "🦺 - Add or update code related to validation."
    - "✈️ - Improve offline support."
replacements:
- path: 'docs/version.json'
  find: '    "latest": ".*"'
  replace: '    "latest": "{{.Version}}"'
- path: package.json
  find: '  "version": ".*",'
  replace: '  "version": "{{.VersionNoPrefix}}",'
